spring.application.name=payment-service

server.port=${PAYMENT_SERVICE_PORT:8082}

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:true}
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.datasource.url=${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/payment_service}
spring.datasource.username=${PAYMENT_DB_USERNAME:samuel}
spring.datasource.password=${PAYMENT_DB_PASSWORD:Samuel@1999}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

logging.level.org.springframework.web.client.DefaultRestClient=INFO

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.security.oauth2.resourceserver.jwt.issuer-uri=${IAM_ISSUER_URI:http://localhost:8080}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${IAM_JWK_SET_URI:${IAM_ISSUER_URI:http://localhost:8080}/oauth2/jwks}

payment.security.expected-audience=${IAM_EXPECTED_AUDIENCE:travel-platform-api}
payment.security.claims.user-id=${IAM_USER_ID_CLAIM:user_id}
payment.security.claims.username=${IAM_USERNAME_CLAIM:username}
payment.security.claims.email=${IAM_EMAIL_CLAIM:email}
payment.security.claims.email-verified=${IAM_EMAIL_VERIFIED_CLAIM:email_verified}
payment.security.claims.fallback-sub-as-user-id=${IAM_FALLBACK_SUB_AS_USER_ID:true}

paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.webhook-signing-secret=${PAYSTACK_WEBHOOK_SIGNING_SECRET:}
paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}
paystack.callback-url=${PAYSTACK_CALLBACK_URL:http://localhost:8080/payment-service/api/v1/payments/paystack/callback}

flight-agent.base-url=${FLIGHT_AGENT_BASE_URL:http://127.0.0.1:8091}
flight-agent.internal-secret=${FLIGHT_AGENT_INTERNAL_SECRET:}

payment.notification-allowed-origins=${PAYMENT_NOTIFICATION_ALLOWED_ORIGINS:http://127.0.0.1:5678,http://localhost:5678}
payment.notification-path-prefix=${PAYMENT_NOTIFICATION_PATH_PREFIX:/webhook-waiting/}
payment.notification-publish-delay-ms=${PAYMENT_NOTIFICATION_PUBLISH_DELAY_MS:2000}
payment.notifications.enabled=${PAYMENT_NOTIFICATIONS_ENABLED:true}

payment.public-base-url=${PAYMENT_PUBLIC_BASE_URL:http://localhost:8082}

payment.sandbox-api-key.enabled=${PAYMENT_SANDBOX_API_KEY_ENABLED:true}
payment.sandbox-api-key.header-name=${PAYMENT_SANDBOX_API_KEY_HEADER:X-Payment-Service-Key}
payment.sandbox-api-key.key=${PAYMENT_SANDBOX_API_KEY:}
payment.sandbox-api-key.key-sha256=${PAYMENT_SANDBOX_API_KEY_SHA256:f1ca7a923229f4a27705e2dc13a5627d5c7194c92842c29e4e9002b04704361e}
payment.sandbox-api-key.client-id=${PAYMENT_SANDBOX_CLIENT_ID:sandbox-integrator}
payment.sandbox-api-key.authorities=${PAYMENT_SANDBOX_API_AUTHORITIES:ROLE_SERVICE,SCOPE_service:sandbox,SCOPE_payment:read,SCOPE_payment:create,SCOPE_sandbox:payment:create}

